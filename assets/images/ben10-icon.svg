<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" fill="none">
  <defs>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2420"/>
      <stop offset="50%" stop-color="#101211"/>
      <stop offset="100%" stop-color="#080a09"/>
    </linearGradient>
    <linearGradient id="bezelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e5c32"/>
      <stop offset="50%" stop-color="#244A27"/>
      <stop offset="100%" stop-color="#142b17"/>
    </linearGradient>
    <linearGradient id="lumeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf44b"/>
      <stop offset="100%" stop-color="#A3E635"/>
    </linearGradient>
    <filter id="lumeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Octagonal Luxury Watch Case -->
  <polygon points="38,8 90,8 120,38 120,90 90,120 38,120 8,90 8,38" 
           fill="url(#caseGrad)" stroke="#244A27" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Bezel Screws -->
  <circle cx="23" cy="23" r="2.2" fill="#244A27"/>
  <circle cx="105" cy="23" r="2.2" fill="#244A27"/>
  <circle cx="105" cy="105" r="2.2" fill="#244A27"/>
  <circle cx="23" cy="105" r="2.2" fill="#244A27"/>

  <!-- Circular Outer Bezel -->
  <circle cx="64" cy="64" r="46" fill="#101211" stroke="url(#bezelGrad)" stroke-width="3"/>
  
  <!-- Subtle Chapter Ring -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#1c281e" stroke-width="1.2" stroke-dasharray="2 4"/>

  <!-- Dial Face -->
  <circle cx="64" cy="64" r="38" fill="#0c0e0d"/>

  <!-- Cardinal Hour Lume Markers (12, 3, 6, 9) -->
  <rect x="62" y="26" width="4" height="8" rx="1.5" fill="url(#lumeGrad)" filter="url(#lumeGlow)"/>
  <rect x="94" y="62" width="8" height="4" rx="1.5" fill="url(#lumeGrad)" filter="url(#lumeGlow)"/>
  <rect x="62" y="94" width="4" height="8" rx="1.5" fill="url(#lumeGrad)" filter="url(#lumeGlow)"/>
  <rect x="26" y="62" width="8" height="4" rx="1.5" fill="url(#lumeGrad)" filter="url(#lumeGlow)"/>

  <!-- Intermediate Hour Markers -->
  <circle cx="80" cy="35" r="1.5" fill="#244A27"/>
  <circle cx="93" cy="48" r="1.5" fill="#244A27"/>
  <circle cx="93" cy="80" r="1.5" fill="#244A27"/>
  <circle cx="80" cy="93" r="1.5" fill="#244A27"/>
  <circle cx="48" cy="93" r="1.5" fill="#244A27"/>
  <circle cx="35" cy="80" r="1.5" fill="#244A27"/>
  <circle cx="35" cy="48" r="1.5" fill="#A3E635"/>
  <circle cx="48" cy="35" r="1.5" fill="#244A27"/>

  <!-- Watch Hands Set to Horological 10:10 -->
  <!-- Hour Hand (-60 deg towards 10 o'clock) -->
  <g transform="rotate(-60 64 64)">
    <path d="M62.5 64 L63.2 46 L64 40 L64.8 46 L65.5 64 Z" fill="#FFFFFF"/>
    <path d="M63.2 45 L64 41 L64.8 45 L64.8 52 L63.2 52 Z" fill="#A3E635"/>
  </g>

  <!-- Minute Hand (+60 deg towards 2 o'clock) -->
  <g transform="rotate(60 64 64)">
    <path d="M62.5 64 L63.2 36 L64 29 L64.8 36 L65.5 64 Z" fill="#FFFFFF"/>
    <path d="M63.2 35 L64 30 L64.8 35 L64.8 46 L63.2 46 Z" fill="#A3E635"/>
  </g>

  <!-- Center Pinion -->
  <circle cx="64" cy="64" r="4.5" fill="#101211" stroke="#244A27" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="2.5" fill="#A3E635" filter="url(#lumeGlow)"/>

  <!-- Dial Submark: "10" -->
  <text x="64" y="55" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-weight="900" font-size="7.5" fill="#A3E635" letter-spacing="0.5">10</text>
</svg>